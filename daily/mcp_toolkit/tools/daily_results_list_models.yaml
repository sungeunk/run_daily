version: 1
kind: command
description: List benchmark model names present in the daily results, optionally scoped to one machine.
params:
- name: machine
  type: str
  optional: true
  description: Machine name to scope the model list to, e.g. LNL-03. Omit for all machines.
run:
  command: $GNAI_TOOLKIT_ENTRYPOINT $GNAI_TOOLKIT_DIRECTORY/src/list_models.py
